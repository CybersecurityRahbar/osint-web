name: Android CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: osint-workbench-v0.5-preview-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Explain APK download and installation
        if: success()
        run: |
          {
            echo "## OSINT Workbench v0.5 preview"
            echo ""
            echo "- The artifact named `osint-workbench-v0.5-preview-apk` downloads as a ZIP file."
            echo "- Extract `app-debug.apk` from that ZIP, then install the APK on Android."
            echo "- Preview application ID: `com.cyberphantom.osintworkbench.preview050`."
            echo "- This preview is intentionally separate from the original app and older preview packages."
            echo "- CI success confirms unit tests and APK packaging; live search-provider behavior still requires device testing."
          } >> "$GITHUB_STEP_SUMMARY"
